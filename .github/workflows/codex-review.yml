name: Codex review

on:
  # Run the base branch's workflow. PR changes are review data, never executed.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pending:
    name: Mark review pending
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              context: 'Independent Codex review',
              state: 'pending',
              description: 'Waiting for independent review of this candidate',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  plan:
    name: Plan exact candidate review
    needs: pending
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      digest: ${{ steps.plan.outputs.digest }}
      overflow: ${{ steps.plan.outputs.overflow }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Build trusted manifest from immutable git objects
        id: plan
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_MANIFEST: ${{ runner.temp }}/review-manifest.json
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_BASE"
          git cat-file -e "$REVIEW_HEAD^{commit}"
          node .github/scripts/review-plan.mjs plan "$REVIEW_BASE" "$REVIEW_HEAD" "$GITHUB_WORKSPACE"

  reviewer:
    name: Review ${{ matrix.chunk }}
    needs: [pending, plan]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.overflow == 'false' && needs.plan.outputs.chunks != '[]' && github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
      fail-fast: false
      max-parallel: 4
    # Store the API key only in this environment; restrict it to main in Settings.
    environment: codex-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a trusted branch and configured API credential
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          API_KEY: ${{ secrets.OLLAMA_CLOUD_API }}
        shell: bash
        run: |
          if [[ "$SAME_REPOSITORY" != true ]]; then
            echo '::error::Fork review requires a maintainer-inspected repository branch. Do not bypass the review gate.'
            exit 1
          fi
          if [[ -z "$API_KEY" ]]; then
            echo '::error::Configure the OLLAMA_CLOUD_API Actions secret before independent review can run.'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Only trusted base files enter the working tree. Inspect the head via git objects.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Regenerate chunk packet and verify plan digest
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_CHUNK: ${{ matrix.chunk }}
          REVIEW_DIGEST: ${{ needs.plan.outputs.digest }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_BASE"
          git cat-file -e "$REVIEW_HEAD^{commit}"
          node .github/scripts/review-plan.mjs render "$REVIEW_BASE" "$REVIEW_HEAD" "$GITHUB_WORKSPACE" "$REVIEW_CHUNK" "$REVIEW_DIGEST"
      # Isolate npm's global binaries before the Action installs packages. The
      # trusted adapter then starts the key-bearing relay in the Action's proxy
      # startup step, after installs and before Codex loses sudo privileges.
      - name: Prepare trusted proxy adapter
        shell: bash
        run: |
          set -euo pipefail
          adapter_bin="$RUNNER_TEMP/codex-review-adapters"
          npm_prefix="$RUNNER_TEMP/codex-review-npm"
          mkdir -p "$adapter_bin" "$npm_prefix"
          ln -s "$GITHUB_WORKSPACE/.github/scripts/codex-cli-wrapper.sh" \
            "$adapter_bin/codex"
          ln -s "$GITHUB_WORKSPACE/.github/scripts/ollama-proxy-wrapper.sh" \
            "$adapter_bin/codex-responses-api-proxy"
          printf 'NPM_CONFIG_PREFIX=%s\n' "$npm_prefix" >> "$GITHUB_ENV"
          printf '%s\n' "$adapter_bin" >> "$GITHUB_PATH"
      # Only trusted report persistence follows Codex; validation uses a fresh runner without the API key.
      - name: Independently review the PR diff
        id: codex
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.OLLAMA_CLOUD_API }}
          responses-api-endpoint: https://ollama.com/v1/responses
          model: gpt-oss:120b
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          # Ollama's Responses endpoint rejects Codex's native web_search tool.
          # The reviewer reads only the generated diff packet and needs no search.
          codex-args: '["--ephemeral","-c","web_search=\"disabled\""]'
          prompt-file: .codex-review-input/prompt.txt
      - name: Persist chunk report as data
        env:
          REVIEW_REPORT: ${{ steps.codex.outputs.final-message }}
          REVIEW_CHUNK: ${{ matrix.chunk }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          assert.match(process.env.REVIEW_CHUNK, /^chunk-\d{3,}$/);
          const directory = join(process.env.RUNNER_TEMP, 'codex-review-report');
          mkdirSync(directory);
          writeFileSync(join(directory, process.env.REVIEW_CHUNK + '.json'), process.env.REVIEW_REPORT ?? '', { flag: 'wx' });
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-${{ matrix.chunk }}
          path: ${{ runner.temp }}/codex-review-report/${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  review-gate:
    name: Publish independent review result
    needs: [pending, plan, reviewer]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Use the base's validator, so a PR cannot simply weaken its own result parser.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Prepare isolated report download directory
        run: mkdir "$RUNNER_TEMP/codex-review-reports"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.plan.result == 'success' && needs.plan.outputs.overflow == 'false' && needs.plan.outputs.chunks != '[]' }}
        with:
          pattern: codex-review-*
          path: ${{ runner.temp }}/codex-review-reports
          merge-multiple: false
      - name: Require every planned chunk to pass for this candidate
        id: validate
        if: ${{ always() }}
        env:
          GATE_PREPARATION_RESULT: ${{ job.status }}
          PLAN_RESULT: ${{ needs.plan.result }}
          REVIEW_RESULT: ${{ needs.reviewer.result }}
          REVIEW_DIGEST: ${{ needs.plan.outputs.digest }}
          REVIEW_REPORTS: ${{ runner.temp }}/codex-review-reports
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/review-gate.mjs
      - name: Publish exact-head status, rejecting a changed PR or base
        if: ${{ always() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
        with:
          script: |
            const original = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: original.number,
            });
            const unchanged = current.head.sha === original.head.sha && current.base.sha === original.base.sha;
            const passed = process.env.VALIDATION_RESULT === 'success' && unchanged;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: original.head.sha,
              context: 'Independent Codex review',
              state: passed ? 'success' : 'failure',
              description: passed ? `Reviewed ${original.head.sha} against ${original.base.sha}` :
                'Review failed, incomplete, or stale; inspect this run and retry',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) core.setFailed('Independent Codex review has not passed for the current candidate.');
